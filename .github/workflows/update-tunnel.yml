name: Update tunnel dependency

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tunnel-dependency
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ github.token }}
      - name: Update only the client input
        id: update
        shell: bash
        run: |
          nix flake update tunnel-client-nix
          if git diff --quiet -- flake.lock; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Test the candidate before publishing
        if: steps.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          umask 022
          nix flake check --no-update-lock-file --print-build-logs
      - name: Publish the tested lock file
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          test "$(git diff --name-only)" = flake.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flake.lock
          git commit --signoff -m 'Update the tunnel-client dependency'
          # A concurrent main update must reject this push and require a new test run.
          git push origin HEAD:refs/heads/main
