interface:
  display_name: "Ultraplan"
  short_description: "Review a plan through ChatGPT Pro and a constrained MCP outbox"
  default_prompt: "Use $ultraplan to prepare a sanitized plan review with my approved policy, including the effective user-scope and project rules for documentation, comments, and commit messages. Hand it to ChatGPT Pro with read-only evidence, then validate the result and resume my original task under its existing authorization and rules."
policy:
  allow_implicit_invocation: false
