interface:
  display_name: "Ultraplan"
  short_description: "Review plans and follow-up rounds through ChatGPT Pro"
  default_prompt: "Use $ultraplan to prepare or continue a sanitized plan review with my approved policy. Investigate relevant changes and gather missing evidence within my existing authorization, including applicable task rules. Hand it to ChatGPT Pro with read-only evidence, then validate the result, prepare justified follow-ups within the round limit, and resume my original task under its existing authorization and rules."
policy:
